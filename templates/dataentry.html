<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry</title>
</head>
<body>
    <h1>Please enter the data here</h1>
    <form action="{{url_for('dataentry')}}" method="post">
        <label for="username">Enter your name:</label>
        <input type="text" id="username" name="username"><br>

        <label for="amt">Stock Amount:</label>
        <input type="number" id="amt" name="amt"><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
